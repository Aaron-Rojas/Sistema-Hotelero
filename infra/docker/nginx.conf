# ==============================================================================
# Configuración Nginx: SPA (React + Vite) + Reverse Proxy hacia ms-reservas-api
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Compresión Gzip para acelerar la entrega de assets en el navegador
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Cabeceras de seguridad HTTP (Hardening de cabeceras)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 1. Enrutamiento SPA: reenvía cualquier ruta del cliente a index.html
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Proxy Inverso hacia el servicio del backend (Evita problemas de CORS en producción)
    # Redirige internamente /api/* hacia el contenedor o servicio 'ms-reservas-api:8080'
    location /api/ {
        proxy_pass http://ms-reservas-api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # 3. Endpoint de salud para balanceadores de carga (ALB / Ingress / Docker Healthcheck)
    location /health {
        access_log off;
        return 200 "healthy\n";
    }
}
