version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. Base de Datos Relacional (PostgreSQL 15 - Persistencia ACID)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: hotel-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hotel_reservas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hotel_reservas_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # ----------------------------------------------------------------------------
  # 2. Caché en Memoria (Redis 7 - Latencia < 5ms Query Model)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: hotel-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # ----------------------------------------------------------------------------
  # 3. Bus de Mensajería Cloud (Amazon SQS local vía LocalStack)
  # ----------------------------------------------------------------------------
  localstack:
    image: localstack/localstack:latest
    container_name: hotel-localstack
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=sqs
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=0
    volumes:
      - "./docker/localstack/init-sqs.sh:/etc/localstack/init/ready.d/init-sqs.sh:ro"
      - "/var/run/docker.sock:/var/run/docker.sock"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hotel-network

  # ----------------------------------------------------------------------------
  # 4. API Stateless (Spring Boot - Manejo exclusivo de peticiones HTTP RESTful)
  # ----------------------------------------------------------------------------
  ms-reservas-api:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: hotel-ms-reservas-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=api
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hotel_reservas_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - AWS_SQS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - hotel-network

  # ----------------------------------------------------------------------------
  # 5. Worker Asíncrono de Pagos (Reutiliza imagen Backend sin exponer puertos HTTP)
  # ----------------------------------------------------------------------------
  ms-pagos-worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    container_name: hotel-ms-pagos-worker
    restart: unless-stopped
    environment:
      - SPRING_PROFILES_ACTIVE=worker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/hotel_reservas_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres123
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - AWS_SQS_ENDPOINT=http://localstack:4566
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - hotel-network

  # ----------------------------------------------------------------------------
  # 6. Frontend SPA (React + Vite + Nginx Reverse Proxy)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
    container_name: hotel-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - ms-reservas-api
    networks:
      - hotel-network

  # ----------------------------------------------------------------------------
  # 7. Observabilidad: Métricas en Tiempo Real (Prometheus)
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: hotel-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - "./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
    networks:
      - hotel-network

  # ----------------------------------------------------------------------------
  # 8. Observabilidad: Dashboards y Visualización (Grafana)
  # ----------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.2.0
    container_name: hotel-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - "./infra/monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro"
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - hotel-network

networks:
  hotel-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  grafana_data:
    driver: local
