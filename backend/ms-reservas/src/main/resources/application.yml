server:
  port: ${PORT:8080}
  # Configuración para ejecución segura detrás de Application Load Balancer (ALB)
  forward-headers-strategy: framework

spring:
  application:
    name: ms-reservas

  # Configuración de base de datos PostgreSQL con HikariCP (12-Factor externalized)
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hotel_reservas_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:postgres123}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Ajustes de pool optimizados para entornos de contenedores elásticos
      pool-name: ReservasHikariPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:5}
      idle-timeout: 300000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      # En producción/cloud se usa 'validate' para delegar el control de esquema a Flyway
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # Control de versiones de esquema con Flyway
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Caché de ultra baja latencia con Redis (Amazon ElastiCache)
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:${REDIS_HOST:localhost}}
      port: ${SPRING_DATA_REDIS_PORT:${REDIS_PORT:6379}}
      timeout: 2000ms

  # Configuración de integración con AWS Cloud / LocalStack
  cloud:
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sqs:
        # Endpoint personalizable: en local apunta a LocalStack (http://localhost:4566), en AWS se omite o usa el endpoint regional
        endpoint: ${AWS_SQS_ENDPOINT:${AWS_ENDPOINT_URL:http://localhost:4566}}

# Configuración personalizada de la cola SQS de reservas
cloud:
  aws:
    sqs:
      queue:
        reservation-events: ${SQS_RESERVATION_QUEUE_NAME:hotel-reservation-events-queue}

# Exposición de métricas y chequeos de salud para Kubernetes y Prometheus
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# Documentación OpenAPI 3.1
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

